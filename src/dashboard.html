<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BrosAI Dashboard</title>
  <style>
    :root{--bg:#080d1c;--panel:#10172a;--panel2:#182442;--panel3:#202d50;--border:#29395b;--text:#eef2ff;--muted:#9aa8c2;--accent:#5b5cf0;--accent-hi:#22d3ee;--accent-soft:#182957;--green:#35d399;--blue:#7dd3fc;--amber:#f4bf5f;--red:#fb7185;--purple:#b79cff;--coral:#fb7185;--shadow:0 18px 50px #03071499}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 8% 0%,#18265a 0,transparent 32%),radial-gradient(circle at 92% 100%,#12384a 0,transparent 28%),var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
    .mono{font-family:ui-monospace,SFMono-Regular,Cascadia Code,Menlo,monospace}.muted{color:var(--muted)}.hidden{display:none!important}
    a{color:var(--accent-hi)}::selection{background:#22d3ee55;color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #22d3ee55;outline-offset:2px}
    .app{height:100vh;display:grid;grid-template-rows:52px minmax(0,1fr)}
    .topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #344674;background:linear-gradient(90deg,#0c1429ee,#111a36ee 52%,#0b2031ee);box-shadow:0 8px 30px #05091566;backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:10px;min-width:210px;font-weight:700}.brand-mark{width:30px;height:30px;display:block;border-radius:9px;box-shadow:0 6px 18px #5b5cf055}.brand-wordmark{width:82px;height:30px;object-fit:contain;object-position:left center}.brand-name{display:none}.connection{width:7px;height:7px;border-radius:50%;background:var(--accent-hi);box-shadow:0 0 10px #22d3ee99}
    .top-controls{display:flex;align-items:center;gap:8px;margin-left:auto}.provider-select{min-width:230px;max-width:260px}
    select,input,textarea{color:var(--text);background:#111a31;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color .16s ease,box-shadow .16s ease}select:focus,input:focus,textarea:focus{border-color:var(--accent-hi);box-shadow:0 0 0 4px #22d3ee22}
    select{height:32px;padding:0 28px 0 9px}.seg{display:flex;height:32px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--panel)}.seg button{border:0;border-radius:5px;padding:0 10px;background:transparent;color:var(--muted)}.seg button.on{background:var(--accent);color:white}.seg.plan-on button.on{background:var(--amber);color:#0b1120}
    .icon-btn{height:32px;border:1px solid var(--border);border-radius:8px;background:#111a31;color:var(--text);padding:0 10px;transition:transform .16s ease,border-color .16s ease,background .16s ease}.icon-btn:hover{background:var(--panel2);border-color:#53699e;transform:translateY(-1px)}
    .status{display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}.status-path{max-width:230px;overflow:hidden;text-overflow:ellipsis}
    .layout{min-height:0;display:grid;grid-template-columns:232px minmax(420px,1fr) 292px}.left,.right{min-height:0;background:#0d1426cc}.left{border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column}.right{border-left:1px solid var(--border);overflow:auto;box-shadow:-12px 0 40px #03071433}
    .section-head{display:flex;justify-content:space-between;align-items:center;height:28px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.new-chat{width:100%;height:34px;border:1px solid var(--border);border-radius:6px;background:#1a2438;color:var(--text);margin:4px 0 10px}.new-chat:hover{border-color:#3d5478}
    .session-list{display:grid;gap:3px;overflow:auto;flex:1}.session{width:100%;text-align:left;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);padding:8px}.session:hover{background:var(--panel)}.session.active{background:#1d2a44;border-color:#2c3d5c}.session-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{margin-top:3px;color:var(--muted);font-size:11px}.workspace{margin-top:10px}
    .workspace-card{border:1px solid var(--border);border-radius:7px;padding:8px;background:var(--panel)}.workspace-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.workspace-actions{display:flex;gap:6px;margin-top:8px}.workspace-actions button{flex:1;height:28px}
    .chat{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--bg)}.mode-banner{display:none;align-items:center;justify-content:center;height:34px;border-bottom:1px solid #d2992255;background:#d2992212;color:#f0c674;font-size:12px}.mode-banner.show{display:flex}
    .messages{min-height:0;overflow:auto;padding:22px 24px 14px;scroll-behavior:smooth}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted)}.empty-mark{font-size:28px;color:var(--accent-hi);margin-bottom:10px}.empty h1{margin:0 0 5px;color:var(--text);font-size:19px}.empty p{max-width:430px;margin:8px auto 18px}.prompts{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.prompt{border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);padding:8px 10px}
    .message{max-width:900px;margin:0 auto 16px}.message.user{display:flex;justify-content:flex-end}.message.user .bubble{max-width:min(78%,680px);background:#16233c;border:1px solid #274067;border-radius:9px;padding:9px 12px;white-space:pre-wrap}.message.assistant{color:var(--text)}.assistant-content{white-space:pre-wrap;word-break:break-word}.assistant-content.streaming{border-right:1px solid var(--blue);animation:cursor 1s steps(1) infinite}@keyframes cursor{50%{border-color:transparent}}
    .thinking{color:var(--muted);display:inline-flex;align-items:center;gap:6px}.thinking .td{width:6px;height:6px;border-radius:50%;background:var(--accent-hi);animation:tblink 1.2s infinite}.thinking .td:nth-child(2){animation-delay:.2s}.thinking .td:nth-child(3){animation-delay:.4s}@keyframes tblink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    .assistant-content .code{display:block;background:#0a0f1c;border:1px solid var(--border);border-radius:6px;padding:10px;margin:8px 0;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Cascadia Code,Menlo,monospace;font-size:12px;white-space:pre}
    .assistant-content .ic{background:#1a2438;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:12px}
    .assistant-content .md-h{font-weight:700;margin:10px 0 4px}.assistant-content .md-li{padding-left:14px}
    .tool-card{border:1px solid var(--border);border-radius:7px;background:#0e1524;margin:7px 0;overflow:hidden}.tool-card summary{list-style:none;display:flex;align-items:center;height:36px;padding:0 10px;cursor:pointer}.tool-card summary::-webkit-details-marker{display:none}.tool-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:8px}.tool-card.command .tool-dot{background:var(--amber)}.tool-card.write .tool-dot{background:var(--accent-hi)}.tool-card.mcp .tool-dot{background:var(--purple)}.tool-name{color:var(--text);font-weight:600}.tool-summary{margin-left:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.tool-status{margin-left:auto;color:var(--green)}.tool-status.fail{color:var(--red)}.tool-body{border-top:1px solid var(--border);padding:9px 10px}.tool-body pre{margin:0;white-space:pre-wrap;word-break:break-word;color:#c9d1d9;font-size:12px}
    .approval{position:sticky;bottom:8px;z-index:3;margin:12px auto 0;max-width:900px;border:1px solid #d29922;border-radius:8px;background:#211b10;box-shadow:0 8px 24px #0008;padding:10px}.approval-head{display:flex;gap:8px;align-items:center;color:#f0c674;font-weight:700}.approval-command{margin:8px 0;color:#f0f6fc;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:12px}.approval-actions{display:flex;gap:7px}.approval-actions button{height:30px;border-radius:6px;border:1px solid var(--border);background:#1a2438;color:white}.approval-actions .danger{border-color:#f8514966;color:#ff9c96}.approval-actions .warn{border-color:#d29922;color:#f0c674}
    .composer-wrap{border-top:1px solid var(--border);padding:12px 24px 14px;background:#0b1224aa}.composer{max-width:900px;margin:auto;border:1px solid #344674;border-radius:13px;background:#111a31;box-shadow:0 12px 36px #03071466;padding:8px}.composer:focus-within{border-color:#5963ef;box-shadow:0 0 0 4px #5b5cf022,0 12px 36px #03071466}.composer-row{display:flex;align-items:flex-end;gap:8px}.composer textarea{width:100%;min-height:38px;max-height:160px;resize:none;border:0;background:transparent;padding:7px;line-height:20px}.composer textarea:focus{border:0}.composer-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px}.composer-meta{margin-right:auto;color:var(--muted);font-size:11px}.attach{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--muted)}.send{height:32px;border:0;border-radius:6px;background:var(--accent);color:white;padding:0 12px}.send:hover{background:var(--accent-hi)}.stop{height:32px;border:1px solid #da3633;border-radius:6px;background:#da36331c;color:#ff9b94;padding:0 10px}.img-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--muted);font-size:11px;padding:3px 8px;margin-right:6px}
    .panel-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0e1524;z-index:2}.panel-tab{height:38px;flex:1;border:0;border-right:1px solid var(--border);background:transparent;color:var(--muted)}.panel-tab:last-child{border-right:0}.panel-tab.on{color:var(--text);box-shadow:inset 0 -2px var(--accent-hi)}.panel-view{padding:10px}.activity-item{display:flex;gap:8px;border-bottom:1px solid #1a2438;padding:9px 2px}.activity-icon{width:20px;height:20px;border:1px solid var(--border);border-radius:5px;display:grid;place-items:center;color:var(--accent-hi)}.activity-body{min-width:0;flex:1}.activity-name{font-weight:600}.activity-detail{margin-top:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.usage-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.usage-card{border:1px solid var(--border);border-radius:7px;padding:8px;background:var(--panel)}.usage-value{font-size:16px;font-weight:700}.usage-label{color:var(--muted);font-size:11px}.todo-list{display:grid;gap:5px}.todo{display:flex;gap:7px;border:1px solid var(--border);border-radius:6px;padding:7px;background:var(--panel)}.todo.done{color:var(--muted);text-decoration:line-through}.todo.active{border-color:#3d5478}.skill-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:7px;background:var(--panel);margin-bottom:6px}.skill-info{flex:1;min-width:0}.skill-name{font-weight:600;font-size:12px}.skill-desc{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-scope{font-size:10px;color:var(--accent-hi);border:1px solid var(--border);border-radius:4px;padding:1px 5px;flex-shrink:0}.skill-del{flex-shrink:0;height:24px;padding:0 8px;font-size:11px}.skill-form{display:grid;gap:6px;margin-bottom:10px}.skill-form input,.skill-form select{height:30px}.todo-dot{color:var(--amber)}
    .drawer{position:fixed;z-index:20;top:52px;right:12px;width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 64px);overflow:auto;border:1px solid var(--border);border-radius:8px;background:#121a2b;box-shadow:0 16px 40px #000a;padding:12px}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.drawer-row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #1a2438;padding:8px 0}.mcp-form{display:grid;grid-template-columns:88px 1fr;gap:7px;margin-top:10px}.mcp-form input,.mcp-form select,.mcp-form textarea{width:100%;padding:7px}.mcp-form textarea{min-height:50px}.mcp-form label{align-self:center;color:var(--muted)}.danger-btn{height:28px;border:1px solid #f8514966;border-radius:5px;background:#da36331c;color:#ff9b94}
    .overlay{position:fixed;z-index:30;inset:0;background:#000a;display:grid;place-items:center}.overlay-card{width:min(860px,92vw);max-height:84vh;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;background:#0e1524;box-shadow:0 24px 60px #000c}.overlay-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}.overlay-body{overflow:auto;padding:12px 14px}.overlay-body pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:12px;color:#c9d1d9}
    @media(max-width:1199px){.layout{grid-template-columns:190px minmax(400px,1fr)}.right{position:fixed;z-index:10;top:52px;right:0;bottom:0;width:280px;transform:translateX(100%);transition:transform .16s ease}.right.open{transform:translateX(0);box-shadow:-12px 0 30px #0008}.workspace{width:170px}}
    @media(max-width:799px){body{overflow:hidden}.app{grid-template-rows:52px minmax(0,1fr)}.topbar{padding:0 8px}.brand{min-width:auto}.brand-name,.status-path,.status-token{display:none}.provider-select{min-width:145px;width:145px}.layout{display:block}.left{display:none}.messages{padding:14px 12px}.composer-wrap{padding:8px}.right{top:52px;width:min(320px,90vw)}.status{display:none}.icon-btn.mcp-desktop{display:none}.approval-actions{flex-wrap:wrap}}
  </style>
</head>

            <div class="composer-actions"><span class="composer-meta" id="composerMeta">Enter send · Shift+Enter newline</span><button class="attach" id="attach" title="Attach image">↥</button><input class="hidden" id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple><button class="stop hidden" id="stop">■ Stop</button><button class="send" id="send">Send</button></div>
          </div>
        </div>
      </main>
      <aside class="right" id="rightPanel">
        <div class="panel-tabs"><button class="panel-tab on" data-view="activity">Activity</button><button class="panel-tab" data-view="todos">Todos</button><button class="panel-tab" data-view="usage">Usage</button><button class="panel-tab" data-view="skills">Skills</button></div>
        <div class="panel-view" id="panelView"></div>
      </aside>
    </div>
  </div>
  <div class="drawer hidden" id="mcpDrawer">
    <div class="drawer-head"><strong>MCP servers</strong><button class="icon-btn" id="mcpClose">Close</button></div>
    <div id="mcpList"></div>
    <div class="mcp-form">
      <label>Name</label><input id="mName" placeholder="github">
      <label>Transport</label><select id="mType"><option value="stdio">stdio</option><option value="http">HTTP</option></select>
      <label id="mCmdLabel">Command</label><input id="mCmd" placeholder="npx -y package">
      <label class="hidden" id="mUrlLabel">URL</label><input class="hidden" id="mUrl" placeholder="https://example.com/mcp">
      <label>Env / Headers</label><textarea id="mEnv" placeholder='{"KEY":"value"}'></textarea>
      <span></span><div><button class="icon-btn" id="mAdd">Connect</button> <span class="muted" id="mMsg"></span></div>
    </div>
  </div>
  <div class="overlay hidden" id="diffOverlay">
    <div class="overlay-card">
      <div class="overlay-head"><strong>Workspace diff</strong><button class="icon-btn" id="diffClose">Close</button></div>
      <div class="overlay-body"><pre id="diffBody" class="mono"></pre></div>
    </div>
  </div>
  <script>
    const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const messages=document.getElementById('messages'),empty=document.getElementById('empty'),input=document.getElementById('input');
    const EMPTY_HTML=empty.innerHTML;
    const hideEmpty=()=>{const e=document.getElementById('empty');if(e)e.classList.add('hidden')};
    const showEmpty=()=>{messages.innerHTML='';const em=document.createElement('div');em.className='empty';em.id='empty';em.innerHTML=EMPTY_HTML;messages.appendChild(em)};
    let curAbort=null,activity=[],todos=[],usage={input:0,output:0,cost:0},pendingImages=0;
    let skills=[];
    async function loadSkills(){const r=await api('/api/skills');skills=r.skills||[];const v=document.querySelector('.panel-tab.on');if(v&&v.dataset.view==='skills')renderPanel()}
    async function api(path,options){const r=await fetch(path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)d.error=d.error||`HTTP ${r.status}`;return d}
    function fmtTok(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n)}
    function fmtUsage(){document.getElementById('usageTop').textContent=`${fmtTok(usage.input+usage.output)} tok · $${(usage.cost||0).toFixed(2)}`;renderPanel()}
    async function getState(){
      try{const s=await api('/api/state');if(s.error)return;document.getElementById('connection').style.background='var(--accent-hi)';
        document.getElementById('provider').innerHTML=s.providers.map(p=>`<option value="${esc(p.id)}" ${p.active?'selected':''}>${esc(p.name)}${p.model?' · '+esc(p.model):''}</option>`).join('');
        document.getElementById('cwd').textContent=s.cwd||'~';document.getElementById('workspacePath').textContent=s.cwd||'~';
        if(s.sessionFile&&s.sessionFile!==currentFile)loadSessions(s.sessionFile);
        setMode(s.mode);const list=document.getElementById('mcpList');document.getElementById('mcpCount').textContent=s.mcp?.length||0;
        list.innerHTML=(s.mcp||[]).length?(s.mcp||[]).map((m,i)=>`<div class="drawer-row"><span><strong>${esc(m.name)}</strong><br><span class="muted mono">${esc(m.url||((m.command||'')+' '+(m.args||[]).join(' ')))}</span></span><button class="danger-btn" data-rm="${i}">Remove</button></div>`).join(''):'<div class="muted">No MCP servers configured</div>';
      }catch{document.getElementById('connection').style.background='var(--red)'}
    }
    function setMode(mode){document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.getElementById('mode').classList.toggle('plan-on',mode==='plan');document.getElementById('modeBanner').classList.toggle('show',mode==='plan')}
    document.getElementById('provider').onchange=async()=>{const r=await api('/api/provider',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:document.getElementById('provider').value})});if(r.error)addError(r.error);getState()};
    document.querySelectorAll('#mode button').forEach(b=>b.onclick=async()=>{await api('/api/mode',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:b.dataset.mode})});setMode(b.dataset.mode)});
    function addError(text){hideEmpty();const d=document.createElement('div');d.className='message assistant';d.innerHTML=`<div class="muted">Error</div><div style="color:var(--red)">${esc(text)}</div>`;messages.appendChild(d);scroll()}
    function scroll(){messages.scrollTop=messages.scrollHeight}
    function toolCard(name,args){
      const type=/command/.test(name)?'command':/write|edit|patch|move/.test(name)?'write':/mcp__/.test(name)?'mcp':'';
      const text=typeof args==='string'?args:(args?JSON.stringify(args):'');
      const d=document.createElement('details');d.className='tool-card '+type;d.open=false;d.dataset.tool=name;
      d.innerHTML=`<summary><span class="tool-dot"></span><span class="tool-name mono">${esc(name)}</span><span class="tool-summary mono">${esc(text.slice(0,180))}</span><span class="tool-status">…</span></summary><div class="tool-body"><pre>${esc(text||'(no arguments)')}</pre></div>`;
      return d;
    }
    function md(src){
      const blocks=[];let s=esc(src);
      s=s.replace(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g,(m,c)=>{blocks.push('<pre class="code">'+c.replace(/\n$/,'')+'</pre>');return '\u0000B'+(blocks.length-1)+'\u0000'});
      s=s.replace(/`([^`\n]+)`/g,'<code class="ic">$1</code>');
      s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
      s=s.replace(/^#{1,4}\s+(.*)$/gm,'<div class="md-h">$1</div>');
      s=s.replace(/^\s*[-*+]\s+(.*)$/gm,'<div class="md-li">• $1</div>');
      s=s.replace(/^\s*\d+\.\s+(.*)$/gm,'<div class="md-li">$&</div>');
      s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      s=s.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);
      return s.replace(/\n/g,'<br>');
    }
    function addAssistantText(){
      hideEmpty();const m=document.createElement('div');m.className='message assistant';const c=document.createElement('div');c.className='assistant-content streaming';c.innerHTML='<span class="thinking"><span class="td"></span><span class="td"></span><span class="td"></span></span> Thinking…';m.appendChild(c);messages.appendChild(m);return c
    }
    async function send(){
      const text=input.value.trim();if(!text||curAbort)return;input.value='';input.style.height='38px';hideEmpty();
      const u=document.createElement('div');u.className='message user';u.innerHTML=`<div class="bubble">${esc(text)}</div>`;messages.appendChild(u);
      const ai=addAssistantText();activity.unshift({name:'Turn',detail:text.slice(0,100),time:Date.now()});renderPanel();
      curAbort=new AbortController();document.getElementById('stop').classList.remove('hidden');document.getElementById('send').disabled=true;
      let reply='';
      try{
        const r=await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,stream:true}),signal:curAbort.signal});
        if(!r.ok||!r.body){ai.parentElement.remove();addError(`Request failed: HTTP ${r.status}`);return}
        const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
        for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});
          let i;while((i=buf.indexOf('\n\n'))>=0){const fr=buf.slice(0,i);buf=buf.slice(i+2);const ev=(fr.match(/^event: (.*)$/m)||[])[1];const dt=(fr.match(/^data: (.*)$/m)||[])[1];if(!ev||dt===undefined)continue;let d={};try{d=JSON.parse(dt)}catch{continue}
            if(ev==='text'){reply+=d.delta||'';ai.textContent=reply;scroll()}
            else if(ev==='tool_start'){const card=toolCard(d.name,d.args);ai.parentElement.insertBefore(card,ai);activity.unshift({name:d.name,detail:JSON.stringify(d.args||{}).slice(0,100),time:Date.now()});renderPanel()}
            else if(ev==='tool_end'){const cards=[...ai.parentElement.querySelectorAll('.tool-card')].filter(c=>c.dataset.tool===d.name);const card=cards[cards.length-1];if(card){const st=card.querySelector('.tool-status');st.textContent=d.ok?'✓':'×';st.classList.toggle('fail',!d.ok);if(d.output){const pre=card.querySelector('pre');pre.textContent=(pre.dataset.args||pre.textContent)+'\n\n'+d.output}}activity.unshift({name:d.name+' ✓',detail:'',time:Date.now()});renderPanel()}
            else if(ev==='todos'){todos=(d.todos||[]).map(t=>({text:t.content||t.text,done:t.status==='completed'||t.done,active:t.status==='in_progress'}));renderPanel()}
            else if(ev==='usage'){usage.input+=d.input||0;usage.output+=d.output||0;fmtUsage()}
            else if(ev==='error'){ai.classList.remove('streaming');ai.style.color='var(--red)';ai.textContent=`Error: ${d.error||'unknown error'}`}
            else if(ev==='done'){ai.classList.remove('streaming');if(d.usage){usage.input=d.usage.input||usage.input;usage.output=d.usage.output||usage.output;usage.cost=d.usage.cost||0;fmtUsage()}ai.innerHTML=md(reply||(d.reply)||'(empty)')+(d.aborted?'<div class="muted" style="font-size:11px;margin-top:4px">■ stopped</div>':'')}
          }
        }
      }catch(e){if(!curAbort?.signal.aborted){ai.classList.remove('streaming');addError(e.message)}}
      finally{ai.classList.remove('streaming');curAbort=null;document.getElementById('stop').classList.add('hidden');document.getElementById('send').disabled=false;pendingImages=0;document.getElementById('imgChips').innerHTML='';scroll();pollApprovals();getState()}
    }
    document.getElementById('send').onclick=send;document.getElementById('stop').onclick=()=>{curAbort?.abort();document.getElementById('stop').classList.add('hidden')};
    input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}if(e.key==='Escape')curAbort?.abort()};
    input.oninput=()=>{input.style.height='38px';input.style.height=Math.min(input.scrollHeight,160)+'px'};
    document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;send()});
    /* sessions */
    let currentFile=null,sessions=[];
    function renderHistory(list){
      hideEmpty();
      for(const m of list||[]){
        if(m.role==='user'){
          const u=document.createElement('div');u.className='message user';
          u.innerHTML=`<div class="bubble">${esc(m.content||'')}${m.images?`<div class="muted" style="font-size:11px;margin-top:4px">🖼 ${m.images} image(s)</div>`:''}</div>`;
          messages.appendChild(u);
        }else if(m.role==='assistant'&&m.content){
          const a=document.createElement('div');a.className='message assistant';
          const c=document.createElement('div');c.className='assistant-content';c.innerHTML=md(m.content);
          a.appendChild(c);messages.appendChild(a);
        }
      }
      scroll();
    }
    async function loadSessions(active){
      const r=await api('/api/sessions');sessions=r.sessions||[];currentFile=active;
      document.getElementById('sessions').innerHTML=sessions.length?sessions.map(s=>`<button class="session ${s.file===currentFile?'active':''}" data-file="${esc(s.file)}"><div class="session-title">${esc(s.file.replace(/\.json$/,''))}</div><div class="session-meta">${esc(s.provider||'')}/${esc(s.model||'')} · ${s.turns||0} turns</div></button>`).join(''):'<div class="muted" style="padding:6px">No saved sessions yet</div>';
    }
    document.getElementById('sessions').onclick=async e=>{const b=e.target.closest('.session');if(!b||b.dataset.file===currentFile)return;const r=await api('/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'load',file:b.dataset.file})});if(r.error){addError(r.error);return}currentFile=b.dataset.file;showEmpty();renderHistory(r.history);activity=[];todos=[];renderPanel();loadSessions(currentFile)};
    document.getElementById('newChat').onclick=async()=>{await api('/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'new'})});currentFile=null;showEmpty();activity=[];todos=[];usage={input:0,output:0,cost:0};fmtUsage();renderPanel();loadSessions(null)};
    /* images */
    document.getElementById('attach').onclick=()=>document.getElementById('file').click();
    document.getElementById('file').onchange=async()=>{const files=[...document.getElementById('file').files];document.getElementById('file').value='';for(const f of files){if(f.size>8*1024*1024){addError(f.name+': over 8MB');continue}const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f)});const r=await api('/api/image',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data,name:f.name})});if(r.error){addError(r.error);continue}pendingImages=r.count;const c=document.createElement('span');c.className='img-chip';c.textContent='🖼 '+f.name+' ('+r.count+')';document.getElementById('imgChips').appendChild(c)}};
    /* approvals */
    async function pollApprovals(){try{const a=await api('/api/approvals');const stack=document.getElementById('approvalStack');stack.innerHTML=(a||[]).map(x=>`<div class="approval" data-id="${x.id}"><div class="approval-head"><span>Approval required</span><span class="muted">shell command</span></div><pre class="approval-command mono">${esc(x.cmd)}</pre><div class="approval-actions"><button data-ok="1" data-all="0">Once</button><button class="warn" data-ok="1" data-all="1">All session</button><button class="danger" data-ok="0" data-all="0">Deny</button></div></div>`).join('')}catch{}}
    document.getElementById('approvalStack').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.approval');await api('/api/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:Number(card.dataset.id),ok:b.dataset.ok==='1',all:b.dataset.all==='1'})});pollApprovals()};
    setInterval(pollApprovals,1000);
    /* mcp drawer */
    document.getElementById('mcpToggle').onclick=()=>document.getElementById('mcpDrawer').classList.toggle('hidden');
    document.getElementById('mcpClose').onclick=()=>document.getElementById('mcpDrawer').classList.add('hidden');
    document.getElementById('mType').onchange=e=>{const http=e.target.value==='http';document.getElementById('mCmd').classList.toggle('hidden',http);document.getElementById('mCmdLabel').classList.toggle('hidden',http);document.getElementById('mUrl').classList.toggle('hidden',!http);document.getElementById('mUrlLabel').classList.toggle('hidden',!http)};
    document.getElementById('mAdd').onclick=async()=>{const type=document.getElementById('mType').value,name=document.getElementById('mName').value.trim(),raw=document.getElementById('mEnv').value.trim();let kv={};if(raw){try{kv=JSON.parse(raw)}catch{document.getElementById('mMsg').textContent='bad JSON';return}}const body={name,transport:type};if(type==='http'){body.url=document.getElementById('mUrl').value.trim();body.headers=kv}else{const p=document.getElementById('mCmd').value.trim().split(/\s+/).filter(Boolean);body.command=p.shift();body.args=p;body.env=kv}const r=await api('/api/mcp/add',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.getElementById('mMsg').textContent=r.error||r.warning||'Connected';getState()};
    document.getElementById('mcpList').addEventListener('click',async e=>{const b=e.target.closest('[data-rm]');if(!b)return;const s=await api('/api/state');const name=s.mcp?.[Number(b.dataset.rm)]?.name;if(name){await api('/api/mcp/remove',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});getState()}});
    /* panel */
    function renderPanel(){const view=document.querySelector('.panel-tab.on')?.dataset.view||'activity',p=document.getElementById('panelView');
      if(view==='activity')p.innerHTML='<div class="section-head"><span>Live turn</span><span>'+activity.length+'</span></div>'+activity.map(a=>`<div class="activity-item"><div class="activity-icon">›</div><div class="activity-body"><div class="activity-name mono">${esc(a.name)}</div><div class="activity-detail">${esc(a.detail)}</div></div></div>`).join('');
      if(view==='todos')p.innerHTML='<div class="section-head"><span>Tasks</span></div><div class="todo-list">'+(todos.length?todos.map(t=>`<div class="todo ${t.done?'done':t.active?'active':''}"><span class="todo-dot">${t.done?'✓':t.active?'▸':'○'}</span><span>${esc(t.text)}</span></div>`).join(''):'<div class="muted">No active tasks</div></div>');
      if(view==='skills')p.innerHTML='<div class="section-head"><span>Skills</span><span>'+skills.length+'</span></div><div class="skill-form"><input id="skName" placeholder="skill name (optional)"><select id="skScope"><option value="global">global (~/.brosai)</option><option value="project">project (.brosai/skills)</option></select><input id="skFile" type="file" accept=".md,.markdown,.txt"><button class="icon-btn" id="skUpload">Upload SKILL.md</button><div class="muted" id="skMsg"></div></div>'+(skills.length?skills.map(k=>`<div class="skill-row"><div class="skill-info"><div class="skill-name">${esc(k.name)} <span class="skill-scope">${esc(k.scope)}</span></div><div class="skill-desc">${esc(k.description||'')}</div></div><button class="danger-btn skill-del" data-sk="${esc(k.name)}">Delete</button></div>`).join(''):'<div class="muted">No skills installed</div>');
      if(view==='usage')p.innerHTML=`<div class="usage-grid"><div class="usage-card"><div class="usage-value">${fmtTok(usage.input+usage.output)}</div><div class="usage-label">session tokens</div></div><div class="usage-card"><div class="usage-value">$${(usage.cost||0).toFixed(2)}</div><div class="usage-label">estimated cost</div></div><div class="usage-card"><div class="usage-value">${usage.input}</div><div class="usage-label">input</div></div><div class="usage-card"><div class="usage-value">${usage.output}</div><div class="usage-label">output</div></div></div>`;
    }
    document.querySelectorAll('.panel-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel-tab').forEach(x=>x.classList.toggle('on',x===b));renderPanel()});
    document.getElementById('panelView').addEventListener('click',async e=>{
      const del=e.target.closest('[data-sk]');
      if(del){const r=await api('/api/skill/rm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:del.dataset.sk})});const m=document.getElementById('skMsg');if(m)m.textContent=r.error||'';loadSkills();return}
      if(e.target.id==='skUpload'){const name=document.getElementById('skName').value.trim(),file=document.getElementById('skFile').files[0],scope=document.getElementById('skScope').value,msg=document.getElementById('skMsg');
        if(!file){msg.textContent='choose a .md file';return}
        const content=await file.text();
        const r=await api('/api/skill',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name||file.name.replace(/\.(md|markdown|txt)$/i,''),content,scope})});
        msg.textContent=r.error||('installed: '+(name||file.name));if(!r.error){document.getElementById('skName').value='';document.getElementById('skFile').value='';loadSkills()}}
    });
    document.getElementById('activityToggle').onclick=()=>document.getElementById('rightPanel').classList.toggle('open');
    /* diff / undo */
    document.getElementById('diffBtn').onclick=async()=>{const d=await api('/api/diff');document.getElementById('diffBody').textContent=d.diff||d.error||'No workspace diff available';document.getElementById('diffOverlay').classList.remove('hidden')};
    document.getElementById('diffClose').onclick=()=>document.getElementById('diffOverlay').classList.add('hidden');
    document.getElementById('diffOverlay').onclick=e=>{if(e.target.id==='diffOverlay')e.target.classList.add('hidden')};
    document.getElementById('undoBtn').onclick=async()=>{if(!confirm('Undo last turn? Workspace files will be restored to the previous checkpoint.'))return;const d=await api('/api/undo',{method:'POST'});addError(d.error||d.message||'Undo requested')};
    fetch('/api/ping').then(r=>document.getElementById('connection').style.background=r.ok?'var(--accent-hi)':'var(--red)').catch(()=>document.getElementById('connection').style.background='var(--red)');
    api('/api/history').then(r=>{if(r.history&&r.history.length)renderHistory(r.history)});
    getState();loadSessions(null);loadSkills();pollApprovals();renderPanel();
  </script>
</body>
</html>
